[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pac-sync"
version = "0.1.0"
description = "Build per-region PAC files from ServiceNow, keep their history in git, deploy them to Zscaler ZIA."
requires-python = ">=3.10"
dependencies = [
    "zscaler-sdk-python>=1.0",
    "requests>=2.31",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pac-sync = "pac_sync.main:main"

[tool.setuptools]
packages = ["pac_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
